name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run package
      - run: npm run test:pair
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openclaw-scribe
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: src/test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: openclaw-scribe
          path: artifacts
      - name: Verify version and publish installable files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./src/package.json").version')"
          cd artifacts
          sha256sum -c SHA256SUMS
          cd ..
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "OpenClaw Scribe $RELEASE_TAG"
